<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06122a">

<title>Kulzzy Radio | Services Payment</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #06122a;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

.payment-page {
  width: 100%;
  max-width: 440px;
  padding: 28px 22px;
  text-align: center;
  background: linear-gradient(145deg, #0b1b38, #102b50);
  border: 2px solid #d4a017;
  border-radius: 18px;
  box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
}

.brand {
  margin: 0 0 10px;
  color: #ffd700;
  font-size: 29px;
  font-weight: 900;
  letter-spacing: 1px;
}

.heading {
  margin: 0;
  color: #ffffff;
  font-size: 21px;
  font-weight: 800;
  line-height: 1.4;
}

.subtitle {
  margin: 14px 0;
  color: #e1e7f0;
  font-size: 15px;
  line-height: 1.7;
}

.amount-label {
  margin-top: 25px;
  color: #ffffff;
  font-size: 14px;
}

.pay-button {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 17px 12px;
  border: 0;
  border-radius: 10px;
  background: #ffd700;
  color: #06122a;
  font-size: 19px;
  font-weight: 900;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.pay-button:active {
  transform: scale(0.98);
}

.notice {
  margin: 18px 0 0;
  color: #d5dceb;
  font-size: 13px;
  line-height: 1.7;
}

.footer {
  margin-top: 27px;
  padding-top: 17px;
  border-top: 1px solid rgba(212, 160, 23, 0.4);
  color: #ffd700;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
}

@media (max-width: 380px) {
  .payment-page {
    padding: 24px 17px;
  }

  .brand {
    font-size: 25px;
  }

  .heading {
    font-size: 19px;
  }
}
</style>
</head>

<body>

<main class="payment-page">

  <h1 class="brand">KULZZY RADIO</h1>

  <h2 class="heading">
    OFFICIAL SERVICES PAYMENT
  </h2>

  <a
    id="payNow"
    class="pay-button"
    href="https://selar.com/5772b1677z?add_to_cart=1"
    target="_blank"
    rel="noopener noreferrer"
  >
    PAY NOW
  </a>

  <p class="notice">
    Tap PAY NOW to continue to the designated payment checkout and follow the instructions to complete your payment.
  </p>

  <footer class="footer">
    KULZZY RADIO — CELEBRATING LIVES EVERYDAY
  </footer>

</main>

</body>
</html>
