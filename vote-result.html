<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta
name="viewport"
content="width=device-width,initial-scale=1"

<title>
Vote Result — Face of Kulzzy Radio 2026
</title><style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    font-family:
        Arial,
        sans-serif;

    background:#06122a;

    color:white;

}


.box{

    width:100%;

    max-width:500px;

    text-align:center;

    padding:35px 25px;

    border-radius:22px;

    background:#0b1d3d;

    border:
        1px solid
        rgba(
            255,
            215,
            0,
            .35
        );

}


.icon{

    font-size:60px;

}


h1{

    color:#ffd700;

}


p{

    color:#b9c6da;

    line-height:1.6;

}


.back{

    display:inline-block;

    margin-top:20px;

    padding:14px 25px;

    border-radius:12px;

    background:#ffd700;

    color:#06122a;

    font-weight:900;

    text-decoration:none;

}

</style></head><body><div class="box"><div
    id="icon"
    class="icon"
>
    ⏳
</div>


<h1 id="title">
    Checking Payment...
</h1>


<p id="message">
    Please wait while we verify
    your payment.
</p>


<a
    class="back"
    href="index.html"
>
    BACK TO CONTESTANTS
</a>

</div><script>

const params =
    new URLSearchParams(
        window.location.search
    );


const icon =
    document.getElementById(
        "icon"
    );


const title =
    document.getElementById(
        "title"
    );


const message =
    document.getElementById(
        "message"
    );


function showResult(){

    const status =
        params.get(
            "status"
        );


    const contestantName =
        params.get(
            "contestantName"
        );


    const votes =
        Number(
            params.get(
                "votes"
            ) || 0
        );


    const amount =
        Number(
            params.get(
                "amount"
            ) || 0
        );


    if(
        status ===
        "success"
    ){

        icon.textContent =
            "🎉";


        title.textContent =
            "VOTE SUCCESSFUL!";


        message.innerHTML =

            "Your support for <strong>" +

            escapeHTML(
                contestantName
            ) +

            "</strong> has been recorded.<br><br>" +

            "❤️ Votes added: <strong>" +

            votes.toLocaleString() +

            "</strong><br>" +

            "💰 Amount paid: <strong>₦" +

            amount.toLocaleString() +

            "</strong>";

        return;

    }


    if(
        status ===
        "failed"
    ){

        icon.textContent =
            "❌";


        title.textContent =
            "PAYMENT NOT CONFIRMED";


        message.textContent =
            "Your payment could not be confirmed. Please return to the contestants page and try again.";

        return;

    }


    icon.textContent =
        "⏳";


    title.textContent =
        "Payment Processing";


    message.textContent =
        "Your payment is being processed. Please return to the contestants page if you need to check your vote status.";

}


function escapeHTML(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /[&<>"']/g,

        character => ({

            "&":
                "&amp;",

            "<":
                "&lt;",

            ">":
                "&gt;",

            '"':
                "&quot;",

            "'":
                "&#039;"

        }[character])

    );

}


showResult();

</script>
</body>
</html>
